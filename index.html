<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohio Scum</title>
<style>
  :root { --yellow:#ffdc25; --red:#d62828; --black:#101010; --cream:#f4eddf; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--cream); color:#111; font-family:Arial,Helvetica,sans-serif; }
  .poster { max-width:1200px; margin:0 auto; position:relative; overflow:hidden; background:var(--cream); }
  .art { display:block; width:100%; height:auto; }
  .carousel {
    position:absolute; left:39%; top:48%; width:55%; min-height:26%;
    display:flex; align-items:center; justify-content:center; color:#fff;
    padding:2.5rem 4.2rem; text-align:center; background:rgba(16,16,16,.97);
    border:5px solid var(--yellow); border-radius:28px;
  }
  .quote { margin:0; font-weight:900; font-size:clamp(1rem,3.3vw,2.5rem); line-height:1.14; letter-spacing:-.035em; }
  .nav {
    position:absolute; top:50%; transform:translateY(-50%); width:clamp(30px,4.5vw,54px);
    height:clamp(30px,4.5vw,54px); border:0; border-radius:50%; background:var(--yellow);
    color:#000; font-size:clamp(1rem,2.8vw,2rem); font-weight:900; cursor:pointer; display:grid; place-items:center;
  }
  .nav:hover { background:#fff; }
  .prev { left:1.2%; } .next { right:1.2%; }
  .dots { position:absolute; bottom:9%; left:0; right:0; display:flex; justify-content:center; gap:12px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#555; border:0; padding:0; cursor:pointer; }
  .dot[aria-current="true"] { background:var(--yellow); }
  .footer {
    margin:0; padding:17px 12px 22px; text-align:center; color:#fff; background:var(--black);
    font:clamp(12px,1.6vw,17px)/1.4 Georgia,serif;
  }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (max-width:600px) {
    .carousel { left:36%; top:48%; width:60%; min-height:27%; padding:1.4rem 2rem 2rem; border-width:3px; border-radius:18px; }
    .quote { font-size:clamp(.75rem,3.3vw,1.15rem); }
    .dots { bottom:7%; gap:6px; } .dot { width:7px; height:7px; }
    .nav { width:23px; height:23px; font-size:14px; } .prev { left:1%; } .next { right:1%; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main class="poster">
  <!-- The generated poster is embedded below as a separate local image file. Keep it beside this HTML. -->
  <img class="art" src="ohio_scum_poster.png" alt="Satirical Ohio Scum political poster featuring a cartoon caricature of Vivek Ramaswamy with dollar-sign eyes.">
  <section class="carousel" aria-label="Fictional quote carousel">
    <button class="nav prev" id="prev" type="button" aria-label="Previous quote">‹</button>
    <blockquote class="quote" id="quote" aria-live="polite">“Pedo protectors are the voice of my campaign.”</blockquote>
    <button class="nav next" id="next" type="button" aria-label="Next quote">›</button>
    <div class="dots" id="dots" aria-label="Choose quote"></div>
  </section>
</main>
<footer class="footer">Paid for by nobody. These quotes are all fake.</footer>
<script>
  const quotes = [
    "Pedo protectors are the voice of my campaign.",
    "Children being r****? Yes, I exploit that for politics!",
    "You should Google how I got rich…",
    "I like to taunt childhood r**** victims!"
  ];
  let current = 0;
  const quoteEl = document.getElementById("quote");
  const dotsEl = document.getElementById("dots");

  quotes.forEach((_, index) => {
    const dot = document.createElement("button");
    dot.type = "button";
    dot.className = "dot";
    dot.setAttribute("aria-label", `Show quote ${index + 1}`);
    dot.addEventListener("click", () => showQuote(index));
    dotsEl.appendChild(dot);
  });

  function showQuote(index) {
    current = (index + quotes.length) % quotes.length;
    quoteEl.textContent = `“${quotes[current]}”`;
    [...dotsEl.children].forEach((dot, i) => dot.setAttribute("aria-current", String(i === current)));
  }
  document.getElementById("prev").addEventListener("click", () => showQuote(current - 1));
  document.getElementById("next").addEventListener("click", () => showQuote(current + 1));
  showQuote(0);
  setInterval(() => { if (!document.hidden) showQuote(current + 1); }, 5000);
</script>
</body>
</html>
